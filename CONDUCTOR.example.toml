# Conductor configuration for this project (the conductor lives in ../conductor): which agents
# implement, check, review and plan, the verification gate it runs after every committing turn,
# the prompts it sends, and project commands (/deploy, /serve) that only run when sent from the
# chat. The conductor re-reads it when a command starts (/next, /review, /plan...), so edits apply
# without a restart.

[gate]
build = "cmake --build --preset desktop"
test = "ctest --preset desktop"

[roles]
implement = "glm"
feedback = "dsf"
review = "opus"
plan = "opus"

[agents.glm]
harness = "opencode"
model = "zai-coding-plan/glm-5.3"
variant = "default"
tag = "glm53"

[agents.ds]
harness = "opencode"
model = "deepseek/deepseek-v4-pro"
variant = "default"
tag = "deepseek4pro"

[agents.dsf]
harness = "opencode"
model = "deepseek/deepseek-flash"
variant = "default"
tag = "deepseek41flash"

[agents.opus]
harness = "claude"
model = "claude-opus-5-5"
effort = "medium"
tag = "opus55"

[flow]
# feedback checks (roles.feedback reports, the implementer fixes) before the review; 0 skips them
feedback_rounds = 2

[logs]
dir = "wlog"

[commands.deploy]
cmd = "deploy/deploy.sh"
description = "git push, build and upload images, update the VPS"
confirm = true

[commands.serve]
cmd = "cmake --build build-wasm && exec deploy/serve.py"
description = "rebuild wasm and serve it over https with a local game server"
background = true
ready = "open https://"

[prompts]
implement = "please do {id}"
review = "please review {id}"
fix = "please fix all issues, commit"
fix_notes = "please fix {notes}; then commit"
feedback = """
Check the work on {id}: the commits after {base} in this tree, made by another agent. Report \
only: do not edit files or commit. Go through:
- each requirement and validation step of {id} in PLAN.md (or its CHANGELOG.md entry if it \
moved there): done or not, with evidence from the diff or a command you ran
- comments in or next to the changed code that are out of date or break the project's rules
- claims in the commit messages or CHANGELOG.md that nothing in the diff, tests or logs backs up
- formatting of the touched files, and the tests covering them
- bugs you can show with a concrete input or a failing test

Give each finding a file:line and the change it needs. Skip style preferences and guesses. \
End with a line `VERDICT: clean` when nothing needs fixing, otherwise `VERDICT: findings`."""
feedback_again = """
The implementer answered your findings: its reply is below and its new commits are in the \
tree. Check the fixes and whether anything you raised is still open; drop findings it \
rejected for a sound reason. Same rules, same VERDICT line.

{reply}"""
feedback_fix = """
Another agent checked your work on {id} and reported the findings below. Fix the ones that \
hold in a new commit (do not amend); for each one you reject, say why in a line.

{findings}"""
continue = """
Your last turn stopped before it finished (an error, an interruption or a restart). Check where \
the work stands and carry on from there."""
gate_failed = """
The verification gate failed after your last turn (step `{step}`). Fix it and commit. \
Output tail:

```
{output}
```"""
plan = """
Planning discussion{topic}. You may read the repository, but edit only PLAN.md: no code \
changes and no commits. Discuss with me first; I will say when to write the items down."""
plan_done = """
Please write the agreed items into PLAN.md now and commit only PLAN.md, following the \
project's commit message rules."""
plan_read_only = """
A task is running in this tree right now ({running}), so this turn is read-only: draft the \
items in your reply instead of editing PLAN.md. They get written once the task is idle and \
I ask for it."""
plan_moved = """
Commits landed since your last turn:
{commits}
Re-read PLAN.md (a finished task moves its item to CHANGELOG.md) and check these changes against \
what we planned; point out any adjustments the items need."""
chat = """
This is a read-only chat about the project. Another agent may be working in this tree right \
now, so uncommitted changes may be theirs. Do not edit files or run anything that changes \
state.

{message}"""
summary = """
Read {log}: the log of the {role} session for {task}, which is {state}. It can be long, \
so start from the end and read back only as far as you need. Then tell me in a few short \
bullets: the goal, what is done, what it is doing right now, and any problems or open \
questions. Change nothing."""
